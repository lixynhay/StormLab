name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Ruff (unused imports / locals)
        run: python -m ruff check . --select F401,F841

  agents:
    name: agents (sync_agents --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generated agent adapters are in sync
        run: python scripts/sync_agents.py --check

  test:
    name: test py${{ matrix.python-version }} (pytest --cov=stormlab)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (binary wheels only, see README)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
      # Baseline 73% was measured with `--cov=.` (code + tests). With
      # `--cov=stormlab` only, the same suite gives 64.43% on Python 3.11;
      # the gate is set to 64 so it reflects application code only.
      - name: Pytest with coverage gate
        run: python -m pytest --cov=stormlab --cov-report=term-missing --cov-fail-under=64 -q

  smoke:
    name: smoke (import bot, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Import smoke
        run: python -c "import bot, api; print('imports ok')"
