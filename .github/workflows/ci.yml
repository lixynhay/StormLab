name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install ruff with uv
        run: uv pip install --system ruff
      - name: Ruff (unused imports / locals)
        run: ruff check . --select F401,F841

  agents:
    name: agents (sync_agents --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Verify generated agent adapters are in sync
        run: uv run --no-project python scripts/sync_agents.py --check

  test:
    name: test py${{ matrix.python-version }} / ${{ matrix.os }} (pytest --cov=stormlab)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        exclude:
          # numpy >= 2.5.5 has no cp313 wheels on windows runners.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: uv version
        run: uv --version
      # A local .venv makes `uv run` deterministic; `--system` would depend on
      # which interpreter uv discovers on a fresh runner.
      - name: Create uv environment and install runtime dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --no-build -r requirements.txt
      # Baseline 73% was measured with `--cov=.` (code + tests). With
      # `--cov=stormlab` only, the same suite gives 64.43% on Python 3.11;
      # the gate is set to 64 so it reflects application code only.
      - name: Pytest with coverage gate
        run: uv run pytest --cov=stormlab --cov-report=term-missing --cov-fail-under=64 -q

  smoke:
    name: smoke (import bot, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Create uv environment with runtime dependencies only
        run: |
          uv venv --python 3.12
          uv pip install --no-build -r requirements.txt
      - name: Import smoke
        run: uv run python -c "import bot, api; print('imports ok')"
