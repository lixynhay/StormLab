# Gradual mypy profile for StormLab (Batch E).
# Global baseline: a few strict-adjacent checks, not full --strict.
# Legacy runtime code is exempted per module below, with the exact error
# classes documented. No runtime behaviour is changed by these exceptions.

[mypy]
python_version = 3.12
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
strict_equality = True
warn_unused_configs = True
warn_unused_ignores = True

# python-telegram-bot types expose Optional callback/message/job_queue fields;
# handlers already guard them at runtime. Typing the guards would be a code
# change, so these checks are deferred per module.
[mypy-stormlab.bot]
strict_optional = False
disable_error_code = index, arg-type, union-attr, attr-defined

# Provider chain uses dynamic kwargs and optional credentials.
[mypy-stormlab.ai.ai_providers]
disable_error_code = union-attr, assignment, arg-type, index, override

# HTTP clients build dict payloads incrementally from sparse weather data.
[mypy-stormlab.clients.*]
disable_error_code = union-attr, arg-type, assignment, index, var-annotated

# FastAPI middleware state and in-memory rate-limit dicts are untyped legacy.
[mypy-stormlab.api]
disable_error_code = var-annotated

[mypy-stormlab.rate_limiter]
disable_error_code = var-annotated

[mypy-stormlab.core.storm_indices]
disable_error_code = union-attr, index
